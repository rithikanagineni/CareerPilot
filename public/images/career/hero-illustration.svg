<svg viewBox="0 0 580 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background card for workspace -->
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EEF2FF"/>
      <stop offset="100%" stop-color="#F5F3FF"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4F46FF"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8F7FF"/>
    </linearGradient>
    <linearGradient id="matchGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4F46FF"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="rgba(79,70,255,0.15)"/>
    </filter>
    <filter id="shadow-sm" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="rgba(0,0,0,0.08)"/>
    </filter>
  </defs>

  <!-- Main workspace card -->
  <rect x="40" y="30" width="500" height="420" rx="28" fill="url(#bgGrad)" filter="url(#shadow)"/>

  <!-- Decorative dots background -->
  <circle cx="80" cy="70" r="3" fill="#4F46FF" opacity="0.2"/>
  <circle cx="110" cy="90" r="2" fill="#8B5CF6" opacity="0.15"/>
  <circle cx="500" cy="60" r="3" fill="#06B6D4" opacity="0.2"/>
  <circle cx="470" cy="85" r="2" fill="#4F46FF" opacity="0.15"/>
  <circle cx="520" cy="110" r="2.5" fill="#8B5CF6" opacity="0.12"/>

  <!-- AI Agent header card -->
  <rect x="70" y="55" width="280" height="64" rx="16" fill="url(#cardGrad)" filter="url(#shadow-sm)"/>
  <!-- Agent avatar -->
  <circle cx="110" cy="87" r="22" fill="url(#primaryGrad)"/>
  <text x="110" y="92" font-size="16" text-anchor="middle" fill="white" font-weight="700" font-family="system-ui">CP</text>
  <!-- Agent text -->
  <rect x="143" y="70" width="120" height="10" rx="5" fill="#E0E7FF"/>
  <rect x="143" y="88" width="90" height="8" rx="4" fill="#C7D2FE"/>
  <!-- Active indicator -->
  <circle cx="126" cy="73" r="5" fill="#10B981"/>
  <circle cx="126" cy="73" r="3.5" fill="white"/>
  <circle cx="126" cy="73" r="2.5" fill="#10B981"/>

  <!-- Chat bubble - user message -->
  <rect x="200" y="140" width="200" height="44" rx="14" fill="#4F46FF"/>
  <text x="300" y="160" font-size="10" text-anchor="middle" fill="white" font-family="system-ui" font-weight="500">I want an AI/ML internship</text>
  <text x="300" y="176" font-size="10" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-family="system-ui">in Hyderabad</text>
  <!-- User avatar -->
  <circle cx="415" cy="162" r="16" fill="#E0E7FF"/>
  <text x="415" y="167" font-size="9" text-anchor="middle" fill="#4F46FF" font-weight="700" font-family="system-ui">You</text>

  <!-- Chat bubble - agent response -->
  <rect x="75" y="200" width="240" height="52" rx="14" fill="white" filter="url(#shadow-sm)"/>
  <!-- Agent mini avatar in bubble -->
  <circle cx="100" cy="226" r="13" fill="url(#primaryGrad)"/>
  <text x="100" y="230" font-size="8" text-anchor="middle" fill="white" font-weight="700" font-family="system-ui">CP</text>
  <!-- Thinking dots / activity -->
  <circle cx="130" cy="222" r="4" fill="#4F46FF"/>
  <circle cx="144" cy="222" r="4" fill="#8B5CF6"/>
  <circle cx="158" cy="222" r="4" fill="#06B6D4"/>
  <!-- Response text lines -->
  <rect x="126" y="234" width="170" height="7" rx="3.5" fill="#E0E7FF"/>
  <rect x="126" y="246" width="130" height="7" rx="3.5" fill="#EEF2FF"/>

  <!-- Match score card (floating) -->
  <rect x="330" y="175" width="160" height="120" rx="18" fill="white" filter="url(#shadow)"/>
  <!-- Score ring -->
  <circle cx="380" cy="224" r="30" fill="none" stroke="#EEF2FF" stroke-width="6"/>
  <circle cx="380" cy="224" r="30" fill="none" stroke="url(#matchGrad)" stroke-width="6" 
          stroke-dasharray="157 201" stroke-dashoffset="50" stroke-linecap="round" transform="rotate(-90 380 224)"/>
  <text x="380" y="221" font-size="14" text-anchor="middle" fill="#0f0f1a" font-weight="700" font-family="system-ui">87%</text>
  <text x="380" y="234" font-size="7" text-anchor="middle" fill="#6B7280" font-family="system-ui">Match</text>
  <!-- Score label -->
  <rect x="346" y="263" width="68" height="16" rx="8" fill="#ECFDF5"/>
  <text x="380" y="275" font-size="8" text-anchor="middle" fill="#059669" font-weight="600" font-family="system-ui">Excellent Fit</text>
  <!-- Skill chips -->
  <rect x="420" y="193" width="58" height="14" rx="7" fill="#EEF2FF"/>
  <text x="449" y="204" font-size="7.5" text-anchor="middle" fill="#4F46FF" font-family="system-ui">Python ✓</text>
  <rect x="420" y="212" width="68" height="14" rx="7" fill="#EEF2FF"/>
  <text x="454" y="223" font-size="7.5" text-anchor="middle" fill="#4F46FF" font-family="system-ui">Machine ML ✓</text>
  <rect x="420" y="231" width="46" height="14" rx="7" fill="#FEF9C3"/>
  <text x="443" y="242" font-size="7.5" text-anchor="middle" fill="#92400E" font-family="system-ui">AWS !</text>

  <!-- Skill gap progress bars card -->
  <rect x="70" y="270" width="235" height="120" rx="16" fill="white" filter="url(#shadow-sm)"/>
  <text x="90" y="294" font-size="9.5" fill="#0f0f1a" font-weight="700" font-family="system-ui">Skill Analysis</text>
  <!-- Python bar -->
  <text x="90" y="315" font-size="8" fill="#374151" font-family="system-ui">Python</text>
  <rect x="90" y="319" width="140" height="5" rx="2.5" fill="#EEF2FF"/>
  <rect x="90" y="319" width="126" height="5" rx="2.5" fill="#4F46FF"/>
  <text x="237" y="326" font-size="7" fill="#4F46FF" font-weight="600" font-family="system-ui">90%</text>
  <!-- ML bar -->
  <text x="90" y="342" font-size="8" fill="#374151" font-family="system-ui">Machine Learning</text>
  <rect x="90" y="346" width="140" height="5" rx="2.5" fill="#EEF2FF"/>
  <rect x="90" y="346" width="115" height="5" rx="2.5" fill="#8B5CF6"/>
  <text x="237" y="353" font-size="7" fill="#8B5CF6" font-weight="600" font-family="system-ui">82%</text>
  <!-- AWS bar -->
  <text x="90" y="369" font-size="8" fill="#374151" font-family="system-ui">AWS / Cloud</text>
  <rect x="90" y="373" width="140" height="5" rx="2.5" fill="#EEF2FF"/>
  <rect x="90" y="373" width="42" height="5" rx="2.5" fill="#F59E0B"/>
  <text x="237" y="380" font-size="7" fill="#F59E0B" font-weight="600" font-family="system-ui">30%</text>

  <!-- Opportunity card (floating, right) -->
  <rect x="318" y="310" width="182" height="100" rx="16" fill="white" filter="url(#shadow)"/>
  <!-- Company logo placeholder -->
  <rect x="332" y="322" width="32" height="32" rx="10" fill="#EEF2FF"/>
  <text x="348" y="343" font-size="12" text-anchor="middle" fill="#4F46FF" font-weight="700" font-family="system-ui">Q</text>
  <!-- Company info -->
  <rect x="372" y="326" width="80" height="8" rx="4" fill="#E0E7FF"/>
  <rect x="372" y="340" width="60" height="7" rx="3.5" fill="#EEF2FF"/>
  <!-- Location badge -->
  <rect x="332" y="362" width="58" height="14" rx="7" fill="#EEF2FF"/>
  <text x="361" y="373" font-size="7.5" text-anchor="middle" fill="#4F46FF" font-family="system-ui">Hyderabad</text>
  <!-- Type badge -->
  <rect x="396" y="362" width="52" height="14" rx="7" fill="#F5F3FF"/>
  <text x="422" y="373" font-size="7.5" text-anchor="middle" fill="#7C3AED" font-family="system-ui">Internship</text>
  <!-- CTA button -->
  <rect x="332" y="385" width="155" height="16" rx="8" fill="url(#primaryGrad)"/>
  <text x="409" y="397" font-size="8" text-anchor="middle" fill="white" font-weight="600" font-family="system-ui">View Match Analysis →</text>

  <!-- Action plan card (bottom) -->
  <rect x="70" y="403" width="230" height="35" rx="12" fill="url(#primaryGrad)"/>
  <text x="105" y="416" font-size="9" fill="white" font-weight="600" font-family="system-ui">📋 Career Plan Ready</text>
  <text x="105" y="430" font-size="8" fill="rgba(255,255,255,0.85)" font-family="system-ui">Today · 7-Day · 30-Day Actions</text>

  <!-- Decorative sparkles -->
  <path d="M530 150 L533 158 L541 155 L533 162 L530 170 L527 162 L519 155 L527 158 Z" fill="#4F46FF" opacity="0.6"/>
  <path d="M60 200 L62 205 L67 203 L62 207 L60 212 L58 207 L53 203 L58 205 Z" fill="#8B5CF6" opacity="0.4"/>
  <path d="M545 350 L547 354 L551 352 L547 356 L545 360 L543 356 L539 352 L543 354 Z" fill="#06B6D4" opacity="0.5"/>

  <!-- Connection lines between elements -->
  <path d="M300 87 Q400 100 380 185" stroke="#4F46FF" stroke-width="1.5" stroke-dasharray="4 4" fill="none" opacity="0.25"/>
  <path d="M300 184 Q290 200 310 210" stroke="#4F46FF" stroke-width="1.5" stroke-dasharray="4 4" fill="none" opacity="0.2"/>
</svg>
